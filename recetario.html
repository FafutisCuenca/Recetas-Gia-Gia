
<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>El Recetario | Las Recetas de Gia Gia</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/app.js?v=20261106-1" defer></script>
</head>
<body data-page="recetario">
  <header id="site-header"></header>

  <main>
    <section class="page-banner">
      <span class="eyebrow">Η ΕΛΛΗΝΙΚΗ ΚΟΥΖΙΝΑ</span>
      <h1>Nuestro recetario</h1>
      <p>Tradición griega servida en cada platillo.</p>
    </section>

    <section class="section-wrap">

      <div class="catalog-tools">
        <input id="recipe-search" type="search"
          placeholder="Buscar un platillo o ingrediente...">
<select id="recipe-category">
  <option value="todos">Todas las categorías</option>
  <option value="entrada">Entradas</option>
  <option value="ensalada">Ensaladas</option>
  <option value="plato-fuerte">Platos fuertes</option>
  <option value="postre">Postres</option>
  <option value="aderezo">Aderezos</option>
</select>
      </div>

      <div id="recipe-count" class="result-count"></div>

      <div id="recipe-list"></div>

    </section>
  </main>

  <footer id="site-footer"></footer>
</body>
</html>
